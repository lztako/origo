<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LINE Account Linking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="theme-init.js?v=20260217-theme-library-v1"></script>
  <link rel="stylesheet" href="styles.css?v=20260223-line-link-v1">
  <link rel="stylesheet" href="themes/theme-legacy.css?v=20260217-theme-library-v1">
  <link rel="stylesheet" href="themes/theme-mono.css?v=20260217-theme-library-v1">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-panel login-panel-single" aria-label="LINE account linking">
      <h2>เชื่อมบัญชี LINE OA</h2>
      <p id="lineLinkLead">กำลังตรวจสอบสิทธิ์และเชื่อมบัญชี กรุณารอสักครู่</p>
      <div id="lineLinkStatus" class="login-status" role="status" aria-live="polite"></div>
      <p id="lineLinkDetail" class="login-help"></p>
      <div class="login-actions">
        <button id="lineLinkOpenDashboardBtn" class="refresh-btn login-submit-btn" type="button" disabled>
          เปิด Dashboard
        </button>
      </div>
      <p id="lineLinkUserMeta" class="login-help"></p>
      <p id="lineLinkEnvironment" class="login-help"></p>
      <p class="login-help">หากลิงก์หมดอายุ ให้พิมพ์ <strong>เริ่มใช้งาน</strong> ใน LINE OA เพื่อรับลิงก์ใหม่</p>
    </section>
  </main>

  <script src="supabase-env.js?v=20260224-line-prod-lock-v1"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="line-link.js?v=20260224-line-prod-lock-v1"></script>
</body>
</html>
