<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Origo Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="theme-init.js?v=20260217-theme-library-v1"></script>
  <link rel="stylesheet" href="styles/login-clean.css?v=20260226-login-clean-v1">
</head>
<body class="login-page login-modern">
  <main class="login-modern-shell">
    <section class="login-modern-card" aria-label="Sign in form">
      <header class="login-modern-head">
        <h1>Sign in</h1>
        <p class="login-copy">Use your account credentials to continue.</p>
      </header>

      <form id="loginForm" class="login-form" novalidate>
        <label class="login-field" for="loginEmail">
          <span>Email</span>
          <input id="loginEmail" type="email" autocomplete="email" required>
        </label>
        <label class="login-field" for="loginPassword">
          <span>Password</span>
          <input id="loginPassword" type="password" autocomplete="current-password" required>
        </label>
        <div class="login-actions">
          <button id="loginSubmitBtn" class="login-submit-btn" type="submit">Sign in</button>
        </div>
        <div id="loginStatus" class="login-status" role="status" aria-live="polite"></div>
      </form>
    </section>
  </main>

  <script src="supabase-env.js?v=20260224-line-prod-lock-v1"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="login.js?v=20260224-line-prod-lock-v1"></script>
</body>
</html>
